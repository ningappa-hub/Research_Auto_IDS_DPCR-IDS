# ===========================================================================
# omnetpp.ini — DPCR-IDS Automotive Network Simulation Configuration
#
# Scenarios:
#   [General]            — Base config with no attacks (false positive baseline)
#   [Config DoS]         — DoS flood attack scenario
#   [Config Fuzzy]       — Fuzzy random injection attack
#   [Config GearSpoof]   — Gear masquerade attack
#   [Config RpmSpoof]    — RPM masquerade attack
#   [Config MultiAttack] — Combined attacks
#   [Config BusLoadLow]  — 20% bus load
#   [Config BusLoadMed]  — 50% bus load
#   [Config BusLoadHigh] — 80% bus load
#   [Config ScaleSmall]  — 5 ECUs
#   [Config ScaleMedium] — 10 ECUs
#   [Config ScaleLarge]  — 20 ECUs
# ===========================================================================

[General]
network = dpcrids.AutomotiveNetwork
sim-time-limit = 30s
warmup-period = 1s
repeat = 5
seed-set = ${repetition}

# --- Network Topology ---
*.numSensorECUs = 5
*.numAdasECUs = 2
*.enableDos = false
*.enableFuzzy = false
*.enableSpoof = false

# --- CAN Traffic Parameters ---
*.sensor[*].sendInterval = 2ms          # ~500 msg/s per ECU
*.sensor[*].numCanIds = 10
*.sensor[*].payloadLength = 8

# --- Ethernet Traffic Parameters ---
*.adas[*].sendInterval = 1ms            # ~1000 frames/s per ADAS ECU
*.adas[*].payloadLength = 512

# --- IDS: CAN Expert ---
*.gateway.canExpert.onnxModelPath = "models/can_student.onnx"
*.gateway.canExpert.temperature = 0.95
*.gateway.canExpert.windowSize = 100
*.gateway.canExpert.stride = 50

# --- IDS: Ethernet Expert ---
*.gateway.ethExpert.onnxModelPath = "models/eth_student.onnx"
*.gateway.ethExpert.temperature = 0.5

# --- IDS: Fusion ---
*.gateway.fusion.onnxModelPath = "models/fusion_student.onnx"
*.gateway.fusion.temperature = 1.1
*.gateway.fusion.bucketMs = 250

# --- IDS: Router ---
*.gateway.router.tauLow = 0.15
*.gateway.router.tauHigh = 0.85
*.gateway.router.fallbackUncertaintyLow = 0.3
*.gateway.router.fallbackUncertaintyHigh = 0.7

# --- IDS: Aggregator ---
*.gateway.aggregator.bucketMs = 250
*.gateway.aggregator.failOpen = true

# --- Alert Sink ---
*.alertSink.logFile = "results/ids_alerts_general.csv"

# --- Result Recording ---
output-vector-file = "${resultdir}/${configname}-${repetition}.vec"
output-scalar-file = "${resultdir}/${configname}-${repetition}.sca"
eventlog-file = "${resultdir}/${configname}-${repetition}.elog"

# ===========================================================================
# ATTACK SCENARIOS
# ===========================================================================

[Config DoS]
description = "DoS flood attack on CAN bus"
extends = General
*.enableDos = true
*.dosAttacker.attackInterval = 0.1ms      # 10000 frames/s flood
*.dosAttacker.attackStartTime = 5s
*.dosAttacker.attackDuration = 10s
*.dosAttacker.targetCanId = 0x000
*.alertSink.logFile = "results/ids_alerts_dos.csv"

[Config Fuzzy]
description = "Fuzzy random injection attack on CAN bus"
extends = General
*.enableFuzzy = true
*.fuzzyAttacker.attackInterval = 0.5ms    # 2000 frames/s fuzzing
*.fuzzyAttacker.attackStartTime = 5s
*.fuzzyAttacker.attackDuration = 10s
*.alertSink.logFile = "results/ids_alerts_fuzzy.csv"

[Config GearSpoof]
description = "Gear masquerade spoofing attack"
extends = General
*.enableSpoof = true
*.spoofAttacker.attackInterval = 2ms      # same rate as legitimate ECU
*.spoofAttacker.attackStartTime = 5s
*.spoofAttacker.attackDuration = 10s
*.spoofAttacker.spoofCanId = 0x316
*.spoofAttacker.spoofType = "gear"
*.alertSink.logFile = "results/ids_alerts_gear_spoof.csv"

[Config RpmSpoof]
description = "RPM masquerade spoofing attack"
extends = General
*.enableSpoof = true
*.spoofAttacker.attackInterval = 2ms
*.spoofAttacker.attackStartTime = 5s
*.spoofAttacker.attackDuration = 10s
*.spoofAttacker.spoofCanId = 0x0B4
*.spoofAttacker.spoofType = "rpm"
*.alertSink.logFile = "results/ids_alerts_rpm_spoof.csv"

[Config MultiAttack]
description = "Combined DoS + Fuzzy + Spoof attack"
extends = General
*.enableDos = true
*.enableFuzzy = true
*.enableSpoof = true
*.dosAttacker.attackStartTime = 3s
*.dosAttacker.attackDuration = 5s
*.fuzzyAttacker.attackStartTime = 8s
*.fuzzyAttacker.attackDuration = 5s
*.spoofAttacker.attackStartTime = 14s
*.spoofAttacker.attackDuration = 5s
*.spoofAttacker.spoofType = "gear"
*.alertSink.logFile = "results/ids_alerts_multi.csv"
sim-time-limit = 25s

# ===========================================================================
# BUS LOAD SWEEP (vary number of sensor ECUs)
# ===========================================================================

[Config BusLoadLow]
description = "Low bus load (~20%) — 2 sensor ECUs"
extends = General
*.numSensorECUs = 2
*.enableDos = true
*.dosAttacker.attackStartTime = 5s
*.dosAttacker.attackDuration = 10s
*.alertSink.logFile = "results/ids_alerts_busload_low.csv"

[Config BusLoadMed]
description = "Medium bus load (~50%) — 8 sensor ECUs"
extends = General
*.numSensorECUs = 8
*.enableDos = true
*.dosAttacker.attackStartTime = 5s
*.dosAttacker.attackDuration = 10s
*.alertSink.logFile = "results/ids_alerts_busload_med.csv"

[Config BusLoadHigh]
description = "High bus load (~80%) — 15 sensor ECUs"
extends = General
*.numSensorECUs = 15
*.enableDos = true
*.dosAttacker.attackStartTime = 5s
*.dosAttacker.attackDuration = 10s
*.alertSink.logFile = "results/ids_alerts_busload_high.csv"

# ===========================================================================
# ECU SCALING SWEEP
# ===========================================================================

[Config ScaleSmall]
description = "Small vehicle network — 5 ECUs"
extends = General
*.numSensorECUs = 3
*.numAdasECUs = 2
*.enableFuzzy = true
*.fuzzyAttacker.attackStartTime = 5s
*.fuzzyAttacker.attackDuration = 10s
*.alertSink.logFile = "results/ids_alerts_scale_small.csv"

[Config ScaleMedium]
description = "Medium vehicle network — 10 ECUs"
extends = General
*.numSensorECUs = 7
*.numAdasECUs = 3
*.enableFuzzy = true
*.fuzzyAttacker.attackStartTime = 5s
*.fuzzyAttacker.attackDuration = 10s
*.alertSink.logFile = "results/ids_alerts_scale_med.csv"

[Config ScaleLarge]
description = "Large vehicle network — 20 ECUs"
extends = General
*.numSensorECUs = 15
*.numAdasECUs = 5
*.enableFuzzy = true
*.fuzzyAttacker.attackStartTime = 5s
*.fuzzyAttacker.attackDuration = 10s
*.alertSink.logFile = "results/ids_alerts_scale_large.csv"
