[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpcr-ids"
version = "0.1.0"
description = "Research-first dual-protocol automotive IDS scaffold for CAN and Ethernet."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Codex" }]
dependencies = []

[project.optional-dependencies]
ml = [
  "numpy>=1.24",
  "pandas>=2.0",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "scapy>=2.5",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "onnx>=1.15",
  "onnxruntime>=1.17"
]

[project.scripts]
dpcr-ids = "dpcr_ids.cli:main"
dpcr-ids-benchmark-fusion = "dpcr_ids.export.benchmark:main"
dpcr-ids-replay-fusion = "dpcr_ids.export.replay:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
